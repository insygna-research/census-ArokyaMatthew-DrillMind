name: "DrillMind"
description: |
  Watches live drilling data, flags trouble before it becomes an incident, and answers plain-English questions about the well — built entirely on Equinor's real Volve field data. Real-time drilling analytics on the Equinor Volve open dataset. DrillMind monitors live drilling telemetry, flags abnormal behaviour before it turns into an incident, classifies what the rig is doing, keeps a persistent alert log, and answers plain-English questions about the well — all grounded in real sensor data and daily drilling reports from the Volve field on the Norwegian Continental Shelf. It is built entirely on the Equinor Volve open dataset: 419,745 rows of real sensor data from well 15/9-F-9 A. There is no synthetic data and no mock services — every column name is verified against the actual CSV files. Primary language: python; ships a container definition; observed outbound integrations: api.openai.com, api.anthropic.com, api-inference.huggingface.co, self-hosted inference.
